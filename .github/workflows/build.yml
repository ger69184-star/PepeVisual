name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build-output.txt

      # Короткая выжимка ошибок в виде аннотаций (видно прямо на странице запуска).
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          text = open('build-output.txt', encoding='utf-8', errors='replace').read()
          lines = text.splitlines()
          picked = []
          for i, l in enumerate(lines):
              if re.search(r'error:|warning: \[|What went wrong|Could not|FAILURE|Exception|> ', l):
                  picked.extend(lines[i:i + 3])
          body = '\n'.join(picked) or text[-20000:]
          chunks = [body[i:i + 3500] for i in range(0, len(body), 3500)][:30]
          kinds = ['error'] * 10 + ['warning'] * 10 + ['notice'] * 10
          for kind, c in zip(kinds, chunks):
              c = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::{kind} title=build log::{c}')
          PY

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PepeVisual
          path: build/libs/*.jar
